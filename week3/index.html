<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>Weather App</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <div id="loading" class="loading hidden">
            Loading weather...
        </div>


        <div id="error" class="error hidden">
        </div>


        <div id="weatherCard" class="weather-card hidden">

            <h2 id="cityName">
                City Name
            </h2>

            <p id="condition" class="condition">
                Weather condition
            </p>


            <div class="temperature">
                <span id="temperature">
                    0
                </span>°C
            </div>


            <div class="weather-info">

                <div class="info-box">

                    <span class="icon">💧</span>

                    <p>Humidity</p>

                    <strong id="humidity">
                        0%
                    </strong>

                </div>


                <div class="info-box">

                    <span class="icon">🌡️</span>

                    <p>Feels Like</p>

                    <strong id="feelsLike">
                        0°C
                    </strong>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
