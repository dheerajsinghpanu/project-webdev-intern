<!DOCTYPE html>
<html lang="en">
<head>

  <title>Q2 - Student Marks Table</title>

    th, td { border: 1px solid #333; padding: 0.6rem 1rem; text-align: center; }
    th { background: #333; color: #fff; }
    tr:nth-child(even) { background: #f2f2f2; }

</body>
</html>
